user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_size "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # HTTP server on port 80
    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Echo endpoint - returns request info
        location /echo {
            return 200 "Method: $request_method\nURI: $request_uri\nBody: $request_body\n";
            add_header Content-Type text/plain;
        }

        # Large response endpoint
        location /large {
            return 200 "This is a large response with repeated data to test buffering and throughput.\n$request_uri\n";
            add_header Content-Type text/plain;
        }

        # Default endpoint
        location / {
            return 200 "HTTP Test Server\n";
            add_header Content-Type text/plain;
        }
    }

    # HTTPS server on port 443
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Echo endpoint - returns request info
        location /echo {
            return 200 "Method: $request_method\nURI: $request_uri\nBody: $request_body\n";
            add_header Content-Type text/plain;
        }

        # Large response endpoint
        location /large {
            return 200 "This is a large response with repeated data to test buffering and throughput.\n$request_uri\n";
            add_header Content-Type text/plain;
        }

        # Default endpoint
        location / {
            return 200 "HTTPS Test Server\n";
            add_header Content-Type text/plain;
        }
    }
}
