version: '3.8'

networks:
  buckwild-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  observability:
    external: true
    name: docker_observability

volumes:
  node-1-config:
  node-1-logs:
  node-2-config:
  node-2-logs:
  node-3-config:
  node-3-logs:
  node-4-config:
  node-4-logs:
  node-5-config:
  node-5-logs:
  node-6-config:
  node-6-logs:
  node-7-config:
  node-7-logs:
  node-8-config:
  node-8-logs:
  node-9-config:
  node-9-logs:
  node-10-config:
  node-10-logs:

x-buckwild-node: &buckwild-node
  image: buckwild-runtime:latest
  cap_add:
    - NET_ADMIN
    - BPF
  devices:
    - /dev/net/tun
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 10s
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 512M
      reservations:
        cpus: '0.25'
        memory: 256M

x-otel-collector: &otel-collector
  image: otel/opentelemetry-collector-contrib:0.91.0
  command: ["--config=/etc/otel-collector-config.yaml"]
  volumes:
    - ../otel/collector-config.yaml:/etc/otel-collector-config.yaml
  ports:
    - "4317"  # OTLP gRPC receiver (internal only)
    - "4318"  # OTLP HTTP receiver (internal only)
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s
  restart: unless-stopped

services:
  # Node 1 - Buckwild VPN Node
  node-1:
    <<: *buckwild-node
    container_name: buckwild-node-1
    hostname: node-1
    networks:
      buckwild-net:
        ipv4_address: 172.30.0.10
      observability:
    ports:
      - "2221:22"
    volumes:
      - node-1-config:/etc/buckwild
      - node-1-logs:/var/log/buckwild
    environment:
      - NODE_ID=node-1
      - NODE_IP=172.30.0.10
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector-node-1:4317
      - OTEL_SERVICE_NAME=buckwild-node-1
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=topology-test,node.id=1
      - RUST_LOG=info
    depends_on:
      otel-collector-node-1:
        condition: service_healthy

  # OTEL Collector Sidecar for Node 1
  otel-collector-node-1:
    <<: *otel-collector
    container_name: otel-collector-node-1
    hostname: otel-collector-node-1
    networks:
      buckwild-net:
        ipv4_address: 172.30.0.20
      observability:

  # Node 2 - Buckwild VPN Node
