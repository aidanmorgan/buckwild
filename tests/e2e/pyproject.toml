[project]
name = "buckwild-e2e"
version = "0.1.0"
description = "End-to-end test suite for Buckwild VPN"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx[http2]>=0.26.0",
    "pydantic>=2.5.0",
    "websockets>=12.0",
    "cryptography>=42.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: End-to-end tests",
    "protocol: Protocol-specific tests (HTTPS, WebSocket, SSE, HTTP/2)",
    "slow: Long-running tests",
]

[tool.hatch.build.targets.wheel]
packages = ["server", "framework"]
