[package]
name = "buckwild_cli"
version = "0.1.0"
edition = "2021"
authors = ["Buckwild Project"]
description = "CLI utilities for Buckwild frequency hopping network"
license = "MIT"

[[bin]]
name = "buckwild_cli"
path = "src/main.rs"

[dependencies]
# Internal dependencies
buckwild-common = { path = "../../common" }

# CLI
clap = { version = "4.1.8", features = ["derive"] }
dialoguer = "0.10.3"
indicatif = "0.17.3"
console = "0.15.5"

# Async runtime
tokio = { version = "1.25.0", features = ["full"] }

# Networking
socket2 = "0.4.7"
nix = { version = "0.27", features = ["net"] }
hyper = { version = "1.5.2", features = ["client", "http1"] }
hyper-util = { version = "0.1.10", features = ["client-legacy", "tokio", "http1"] }
http-body-util = "0.1.2"

# Logging
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }

# Error handling
thiserror = "1.0.38"
anyhow = "1.0.69"

# Utilities
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.93"
toml = "0.7.2"
chrono = "0.4.23"
humantime = "2.1.0"

# Cryptography
ring = "0.16.20"
hex = "0.4.3"

[dev-dependencies]
assert_cmd = "2.0.8"
predicates = "3.0.3"
tempfile = "3.3.0"

[target.'cfg(target_os = "linux")'.dependencies]
buckwild-ebpf = { path = "../../ebpf/rust" }