[package]
name = "buckwild-common"
version = "0.1.0"
edition = "2021"

[features]
default = []
linux-only = []  # Feature flag for Linux-specific code (eBPF, TUN, rtnetlink)

[dependencies]
thiserror = "2.0"
bytes = "1.9"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
lazy_static = "1.5"
dashmap = "6.1"
parking_lot = "0.12"
crossbeam = "0.8"
ring = "0.17"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tokio = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdh"] }
pbkdf2 = { version = "0.12", features = ["sha2"] }
notify = "6.1"
arrayref = "0.3"
libc = "0.2"
rayon = "1.10"
rand_chacha = "0.3"
async-trait = "0.1"
num_cpus = "1.16"
hostname = "0.4"
rustls = "0.23"
rustls-native-certs = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["net", "ioctl"] }
rtnetlink = "0.14"
netlink-packet-route = "0.21"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3.10"
anyhow = "1.0"
hex = "0.4"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
futures = "0.3"

[[bench]]
name = "packet_serialization"
harness = false
